<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>課題QRコードスキャン</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      text-align: center;
      font-family: sans-serif;
      padding: 15px;
      font-size: 20px;
    }

    /* 見出し */
    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    /* QRコード読み取りエリア */
    #reader {
      width: 100%;
      max-width: 400px;
      margin: auto;
    }

    /* 読み取り結果 */
    #result {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      line-height: 1.6;
    }

    /* カメラ映像 */
    video {
      width: 100% !important;
      height: auto !important;
    }

    /* ボタン */
    button {
      font-size: 20px;
      margin-top: 20px;
      padding: 14px 24px;
      min-height: 55px;
      border-radius: 8px;
    }

    /* スマートフォン向け */
    @media screen and (max-width: 600px) {
      body {
        padding: 12px;
        font-size: 20px;
      }

      h1 {
        font-size: 28px;
      }

      #reader {
        max-width: 100%;
      }

      #result {
        font-size: 22px;
      }

      button {
        font-size: 20px;
        width: 100%;
        padding: 16px;
      }
    }
  </style>
</head>
  
<body>
  <h1>課題QRコードスキャン</h1>
  <div id="reader"></div>
  <div id="result">カメラ初期化中…</div>
  <button onclick="location.href='camera-settings.html'">カメラ設定</button>

  <script>
    async function startScanner() {
      const html5QrCode = new Html5Qrcode("reader");
      const resultEl = document.getElementById("result");
      const selectedDeviceId = localStorage.getItem("cameraId");
      const mirror = localStorage.getItem("mirror") === "true";

      try {
        const devices = await Html5Qrcode.getCameras();
        const targetDeviceId = selectedDeviceId || (devices[0]?.id);
        if (!targetDeviceId) throw new Error("カメラが選択されていません。");

        await html5QrCode.start(
          { deviceId: { exact: targetDeviceId } },
          { fps: 15, qrbox: 250, disableFlip: true },
          qrCodeMessage => {
            resultEl.textContent = "読み取り成功: " + qrCodeMessage;
            html5QrCode.stop();
            sendToGoogleForm(qrCodeMessage.trim().split(" "));
          },
          error => {
            console.warn("スキャンエラー:", error);
          }
        );

        resultEl.textContent = "スキャン中…";
        if (mirror) {
          setTimeout(() => {
            const video = document.querySelector("video");
            if (video) video.style.transform = "scaleX(-1)";
          }, 500);
        }
      } catch (err) {
          console.error("カメラ初期化エラー:", err);
      
          let message = "カメラの初期化に失敗しました。";
      
          if (err.name === "NotAllowedError") {
              message = "カメラの使用が許可されていません。ブラウザの設定を確認してください。";
          } else if (err.name === "NotFoundError") {
              message = "カメラが見つかりません。";
          } else if (err.name === "NotReadableError") {
              message = "カメラが他のアプリで使用されている可能性があります。";
          } else if (err.name === "OverconstrainedError") {
              message = "指定されたカメラを使用できません。";
          } else if (err instanceof Error) {
              message = err.message;
          } else if (typeof err === "string") {
              message = err;
          }
      
          resultEl.textContent = message;
      }
    }

    function sendToGoogleForm(parts) {
      if (parts.length < 5) {
        alert("QRコードの内容が不正です");
        return;
      }

      // 配列に格納する
      let subjectCode; // 科目コード
      let taskNo; // 課題回数
      let taskPages; //課題ページ
      let taskType; // 課題タイプ
      let targetId; // ターゲットID
      let curriculumCode; // 教育課程コード
      let teacherCode = "";

      // 配列の個数によって処理振り分け
      switch (parts.length) {
        case 5:
          subjectCode = parts[0];
          taskNo = parts[1];
          taskPages = parts[2];
          targetId = parts[3];
          curriculumCode = parts[4];
          taskType = "REPORT";
          break;
        case 9:
          subjectCode = parts[2];
          taskNo = parts[5];
          taskPages = parts[6];
          targetId = parts[1];
          curriculumCode = parts[8];
          taskType = parts[0];
          break;
        default:
          alert("QRコードの形式が不正です");
          return;
      }
      
      const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLScwRhzgKKSzDui_xlaHbH5SXpZ_HNPnvKaydBzX2VHBkYCsgg/formResponse";
      const formData = new FormData();
      formData.append("entry.372108176", subjectCode);
      formData.append("entry.1926098411", taskNo); //
      formData.append("entry.1678391181", taskPages);
      formData.append("entry.1988792708", targetId);
      formData.append("entry.1373993560", curriculumCode);
      formData.append("entry.998925870",taskType);

      fetch(formUrl, {
        method: "POST",
        mode: "no-cors",
        body: formData
      }).then(() => {
        document.getElementById("result").textContent = "送信完了！";
        setTimeout(() => location.reload(), 2000); // 次スキャンのためリロード
      }).catch(err => {
        console.error("送信エラー:", err);
        document.getElementById("result").textContent = "送信エラー";
      });
    }

    startScanner();
  </script>
</body>
</html>
